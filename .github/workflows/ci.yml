name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
  
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - run: task test
      - run: task build

  integration:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.4
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 20
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports: ["9324:9324"]
        options: >-
          --health-cmd "nc -z localhost 9324"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      LIMBO_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      LIMBO_TEST_SQS_URL: sqs://us-east-1?endpoint=http://localhost:9324
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run integration tests
        shell: bash
        run: |
          go test -race -count=1 -v ./internal/broker/... | tee integration.log
          if grep -A1 -- '--- SKIP' integration.log; then exit 1; fi
