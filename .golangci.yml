# https://golangci-lint.run/docs/configuration/file/
version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
      - comments

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dnlaglr/limbo
